name: Native validation
on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'app/**', 'vendor/**', 'scripts/**', '.github/workflows/native-validation.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'app/**', 'vendor/**', 'scripts/**', '.github/workflows/native-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/slint"
      - name: Validate workspace
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --locked --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check release configuration and optional GPU backend
        run: cargo clippy --release -p orca-slint --features gpu --locked --all-targets --no-deps -- -D warnings
