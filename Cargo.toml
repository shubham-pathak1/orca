[workspace]
members = ["app", "crates/orca-core", "crates/orca-services"]
default-members = ["app"]
exclude = ["vendor/symphonia-bundle-flac", "vendor/i-slint-renderer-software"]
resolver = "2"

[workspace.package]
version = "0.1.9-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
orca-core = { path = "crates/orca-core" }
orca-services = { path = "crates/orca-services" }
image = { version = "0.25", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
walkdir = "2"
windows-sys = "0.61.2"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
